<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winter Arc 2026 — Public Progress</title><link rel="stylesheet" href="app.css">
<style>
.public{max-width:1080px;margin:auto}.public-head{padding:55px 8px 30px;position:relative}.public-badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:7px 10px;font:10px var(--mono);color:var(--muted);background:#fff9edaa}.public-badge i{width:7px;height:7px;border-radius:50%;background:#1b9b77}.public-name{font-size:clamp(60px,9vw,110px);margin-top:18px}.public-sub{max-width:650px}.public-updated{font:11px var(--mono);color:var(--muted);margin-top:14px}.public-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.public-card{border:1px solid var(--line);border-radius:16px;background:#fff9efdc;box-shadow:var(--shadow);padding:20px}.public-card h2{margin:4px 0 13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:14px;border:1px solid #eadfce;border-radius:12px;background:#fffaf2}.metric b{display:block;font:34px/.85 var(--hand);color:var(--navy)}.metric span{display:block;margin-top:6px;font:9px var(--mono);text-transform:uppercase;color:var(--muted)}.progress-track{height:10px;background:#e7dfd2;border-radius:10px;overflow:hidden;margin:14px 0 5px}.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--blue));border-radius:inherit}.day-list{display:grid;gap:8px}.day{border:1px solid #eadfce;border-radius:12px;background:#fffaf2;padding:11px 12px}.day-head{display:flex;justify-content:space-between;gap:10px;font:19px/.9 var(--hand);color:var(--navy)}.day-meta{font:10px var(--mono);color:var(--muted);margin-top:5px}.task{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed #e2d7c5;margin-top:8px;font:15px var(--hand);color:var(--muted)}.task b{font-weight:500;color:var(--ink)}.section-title{font:10px var(--mono);letter-spacing:.1em;color:var(--terracotta);text-transform:uppercase}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border-radius:18px;background:#e9eee3;font:15px var(--hand);color:#496052}.skill{margin:11px 0}.skill-top{display:flex;justify-content:space-between;font:16px var(--hand);color:var(--navy)}.skill-track{height:7px;background:#e7dfd2;border-radius:7px;margin-top:5px;overflow:hidden}.skill-track i{display:block;height:100%;background:var(--blue)}.milestone{display:flex;gap:9px;align-items:center;font:17px var(--hand);padding:7px 0;border-bottom:1px solid #eadfce}.milestone:last-child{border-bottom:0}.milestone b{font-family:var(--sans);font-size:12px}.empty-share{padding:32px;text-align:center;font:21px var(--hand);color:var(--muted)}.public-footer{margin-top:38px;text-align:center;font:16px var(--hand);color:var(--muted)}@media(max-width:850px){.public-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.public{padding:0 4px}.public-head{padding-top:35px}.metrics{grid-template-columns:repeat(2,1fr)}.metric b{font-size:28px}}
</style>
</head>
<body>
<main class="public">
<header class="public-head"><span class="public-badge"><i></i> PUBLIC WINTER ARC · 2026</span><h1 id="name" class="public-name">Loading…</h1><p class="lead public-sub">A selected view of one person's Winter Arc. The private dashboard remains private.</p><div id="updated" class="public-updated"></div></header>
<div id="content"><div class="public-card empty-share">Loading public progress…</div></div>
<div class="public-footer">Shared selectively · Winter Arc 2026</div>
</main>
<script src="supabase-config.js"></script>
<script>
(async()=>{
const name=document.getElementById("name"),updated=document.getElementById("updated"),content=document.getElementById("content");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=new URLSearchParams(location.search).get("profile");
if(!slug){name.textContent="Winter Arc";content.innerHTML='<div class="public-card empty-share">No public profile was specified.</div>';return;}
try{
if(!window.supabase)await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});
const client=window.supabase.createClient(WINTER_ARC_CONFIG.SUPABASE_URL,WINTER_ARC_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const {data,error}=await client.from("winter_arc_public_profiles").select("display_name,snapshot,updated_at").eq("share_slug",slug).maybeSingle();
if(error)throw error;
if(!data){name.textContent="Profile unavailable";content.innerHTML='<div class="public-card empty-share">This public page does not exist or sharing has been turned off.</div>';return;}
name.textContent=data.display_name||"Winter Arc 2026";updated.textContent="Last published "+new Date(data.updated_at).toLocaleString();
const s=data.snapshot||{},p=s.progress||{},st=s.streak||{};let html="";
if(s.progress||s.streak){html+='<section class="public-card"><span class="section-title">Season pulse</span><div class="metrics">'+(s.progress?'<div class="metric"><b>'+ (p.completion_rate||0)+'%</b><span>complete</span></div><div class="metric"><b>'+ (p.days_completed||0)+'</b><span>days done</span></div><div class="metric"><b>'+ (p.tasks_completed||0)+'</b><span>tasks done</span></div>':"")+(s.streak?'<div class="metric"><b>'+ (st.current||0)+'</b><span>current streak</span></div>':"")+'</div>'+(s.progress?'<div class="progress-track"><i style="width:'+Math.min(100,Math.max(0,p.completion_rate||0))+'%"></i></div><div class="day-meta">'+(p.tasks_completed||0)+' of '+(p.tasks_total||0)+' selected tasks complete</div>':"")+'</section>';}
const sections=[];
if(Array.isArray(s.days))sections.push('<section class="public-card"><span class="section-title">Daily arc</span><h2>One day at a time.</h2><div class="day-list">'+s.days.map(d=>'<div class="day"><div class="day-head"><span>Day '+d.day+' · '+esc(d.title)+'</span><span>'+(d.complete?"✓ ":"")+d.completed+'/'+d.total+'</span></div><div class="day-meta">'+esc(d.date)+'</div>'+(Array.isArray(d.tasks)?d.tasks.map(t=>'<div class="task"><b>'+esc(t.title)+'</b><span>'+(t.complete?"✓":"—")+'</span></div>').join(""):"")+'</div>').join("")+'</div></section>');
if(Array.isArray(s.skills)&&s.skills.length)sections.push('<section class="public-card"><span class="section-title">Skills</span><h2>Growing through evidence.</h2>'+s.skills.map(x=>'<div class="skill"><div class="skill-top"><span>'+esc(x.name)+'</span><span>'+x.level+'%</span></div><div class="skill-track"><i style="width:'+Math.min(100,Math.max(0,x.level||0))+'%"></i></div></div>').join("")+'</section>');
if(Array.isArray(s.milestones)&&s.milestones.length)sections.push('<section class="public-card"><span class="section-title">Milestones</span><h2>Moments that mattered.</h2>'+s.milestones.map(x=>'<div class="milestone"><b>'+(x.complete?"✓":"○")+'</b><span>'+esc(x.name)+'</span></div>').join("")+'</section>');
if(s.learning&&typeof s.learning==="object"&&s.learning.note)sections.push('<section class="public-card"><span class="section-title">Learning</span><h2>What clicked.</h2><p style="font:20px var(--hand);color:var(--muted)">'+esc(s.learning.note)+'</p></section>');
if(typeof s.note==="string"&&s.note.trim())sections.push('<section class="public-card"><span class="section-title">Shared note</span><p style="font:20px var(--hand);color:var(--muted)">'+esc(s.note)+'</p></section>');
if(Array.isArray(s.projects)&&s.projects.length)sections.push('<section class="public-card"><span class="section-title">Projects</span><h2>Things being built.</h2><div class="chips">'+s.projects.map(x=>'<span class="chip">'+esc(typeof x==="string"?x:x.name||x.title||"Project")+'</span>').join("")+'</div></section>');
if(sections.length){html+='<div class="public-grid">'+sections.join("")+'</div>';}else if(!html){html='<div class="public-card empty-share">This profile is public, but no selected sections have data yet.</div>';}
content.innerHTML=html;
}catch(e){name.textContent="Unable to load";content.innerHTML='<div class="public-card empty-share">The public profile could not be loaded right now.</div>';console.error(e);}
})();
</script>
</body></html>
