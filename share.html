<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winter Arc 2026 — Public Progress</title><link rel="stylesheet" href="app.css"><style>.public-wrap{max-width:980px}.public-hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.public-kicker{font:12px var(--mono);letter-spacing:.12em;color:var(--terracotta)}.public-updated{font:13px var(--hand);color:var(--muted)}.public-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}.public-metric{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.public-metric strong{display:block;font:34px var(--hand);color:var(--navy)}.public-metric span{font:12px var(--mono);color:var(--muted);text-transform:uppercase}.public-section{margin-top:18px}.public-day{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font:16px var(--hand)}.public-empty{padding:30px;text-align:center;color:var(--muted);font:19px var(--hand)}@media(max-width:700px){.public-hero{display:block}}</style></head><body><div class="app"><aside><a class="brand" href="index.html"><span class="brand-mark">❄</span><span class="brand-name">Winter<small>Arc 2026</small></span></a><div class="aside-quote">progress, publicly — privacy, by default</div><div class="privacy"><b>PUBLIC VIEW</b>Read-only snapshot. Only the owner's published sections appear.</div></aside><main class="public-wrap"><header class="page-head public-hero"><div><span class="eyebrow">WINTER ARC · 2026</span><h1 id="name">Loading…</h1><p class="lead">A public progress snapshot.</p></div><div id="updated" class="public-updated"></div></header><div id="content"><div class="public-empty">Loading public profile…</div></div><footer class="footer"><span>WINTER ARC 2026</span><span>Private dashboard · Public snapshot</span></footer></main></div><script src="supabase-config.js"></script><script>
(async()=>{
const name=document.getElementById("name"),updated=document.getElementById("updated"),content=document.getElementById("content"),slug=new URLSearchParams(location.search).get("profile");
if(!slug){name.textContent="Public Winter Arc";content.innerHTML='<div class="public-empty">No public profile was specified.</div>';return;}
try{
if(!window.supabase)await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});
const c=window.supabase.createClient(WINTER_ARC_CONFIG.SUPABASE_URL,WINTER_ARC_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const {data,error}=await c.from("winter_arc_public_profiles").select("display_name,snapshot,updated_at").eq("share_slug",slug).maybeSingle();
if(error)throw error;
if(!data){name.textContent="Profile not found";content.innerHTML='<div class="public-empty">This public page does not exist or sharing has been disabled.</div>';return;}
name.textContent=data.display_name||"Winter Arc 2026";updated.textContent="Updated "+new Date(data.updated_at).toLocaleString();
const s=data.snapshot||{},p=s.progress||{},st=s.streak||{};let html="";
if(s.progress||s.streak)html+='<section class="card"><span class="public-kicker">PROGRESS</span><div class="public-metrics">'+(s.progress?'<div class="public-metric"><strong>'+ (p.completion_rate||0)+'%</strong><span>Completion</span></div><div class="public-metric"><strong>'+ (p.days_completed||0)+'/'+(p.days_total||0)+'</strong><span>Days complete</span></div><div class="public-metric"><strong>'+ (p.tasks_completed||0)+'/'+(p.tasks_total||0)+'</strong><span>Tasks complete</span></div>':"")+(s.streak?'<div class="public-metric"><strong>'+ (st.current||0)+'</strong><span>Current streak</span></div>':"")+'</div></section>';
if(Array.isArray(s.days))html+='<section class="card public-section"><span class="public-kicker">DAILY PROGRESS</span><h2>Challenge timeline</h2>'+s.days.map(d=>'<div class="public-day"><span><b>Day '+d.day+'</b> · '+d.title+'</span><span>'+d.completed+'/'+d.total+' '+(d.complete?"✓":"")+'</span></div>'+(Array.isArray(d.tasks)?d.tasks.map(t=>'<div class="public-day" style="padding-left:18px"><span>'+t.title+(t.detail?' · '+t.detail:"")+'</span><span>'+(t.complete?"✓":"—")+'</span></div>').join(""):"")).join("")+'</section>';
const sections=[["projects","PROJECTS"],["skills","SKILLS"],["milestones","MILESTONES"],["learning","LEARNING"],["timeline","TIMELINE"],["fitness","FITNESS"]];
for(const [k,label] of sections){if(s[k]&&((Array.isArray(s[k])&&s[k].length)||(typeof s[k]==="object"&&!Array.isArray(s[k])&&Object.keys(s[k]).length))){html+='<section class="card public-section"><span class="public-kicker">'+label+'</span><pre style="white-space:pre-wrap;font:16px var(--hand)">'+JSON.stringify(s[k],null,2).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))+'</pre></section>';}}
if(typeof s.note==="string"&&s.note.trim())html+='<section class="card public-section"><span class="public-kicker">SHARED NOTE</span><p style="font:19px var(--hand)">'+s.note.replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))+'</p></section>';
content.innerHTML=html||'<div class="public-empty">This profile is public, but no shareable sections are populated yet.</div>';
}catch(e){name.textContent="Unable to load profile";content.innerHTML='<div class="public-empty">The public profile could not be loaded.</div>';console.error(e);}
})();
</script></body></html>
