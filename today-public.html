<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today — Winter Arc 2026</title>
<link rel="stylesheet" href="app.css">
<style>
.public-today{max-width:900px;margin:auto;padding:36px 18px 60px}
.today-head{padding:24px 0 28px}.public-badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:7px 10px;font:10px var(--mono);color:var(--muted);background:#fff9edaa}.public-badge i{width:7px;height:7px;border-radius:50%;background:#1b9b77}
.today-name{font-size:clamp(58px,9vw,105px);margin:18px 0 10px}.today-date{font:12px var(--mono);color:var(--terracotta);letter-spacing:.08em;text-transform:uppercase}.today-sub{font:23px/1.05 var(--hand);color:#355275;max-width:650px}
.today-card{border:1px solid var(--line);border-radius:18px;background:#fff9efdc;box-shadow:var(--shadow);padding:24px}
.today-status{display:flex;align-items:end;justify-content:space-between;gap:18px}.today-count{font:52px/.85 var(--hand);color:var(--navy)}.today-label{font:10px var(--mono);color:var(--muted);text-transform:uppercase}
.today-track{height:11px;background:#e7dfd2;border-radius:12px;overflow:hidden;margin:18px 0 20px}.today-track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--blue));border-radius:inherit}
.task-list{display:grid;gap:9px}.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid #eadfce;border-radius:12px;background:#fffaf2}.task-mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid #c9bda9;font:14px var(--sans);color:var(--muted)}.task.done .task-mark{background:#e4eee4;border-color:#8aa18a;color:#42634c}.task-title{font:21px/1 var(--hand);color:var(--ink)}.task-detail{margin-top:4px;font:13px/1.1 var(--mono);color:var(--muted)}
.complete-note{margin-top:18px;padding:13px 15px;border-left:3px solid var(--sage);background:#e9eee3;border-radius:0 10px 10px 0;font:20px var(--hand);color:#496052}
.empty-share{padding:34px;text-align:center;font:22px var(--hand);color:var(--muted)}
.today-footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font:11px var(--mono);color:var(--muted)}
@media(max-width:600px){.public-today{padding:22px 12px 40px}.today-card{padding:17px}.today-status{display:block}.today-count{font-size:45px;margin-top:8px}.today-footer{display:block}.today-footer div+div{margin-top:5px}}
</style>
</head>
<body>
<main class="public-today">
<header class="today-head">
<span class="public-badge"><i></i> PUBLIC TODAY · WINTER ARC 2026</span>
<h1 id="name" class="today-name">Loading…</h1>
<div id="date" class="today-date"></div>
<p class="today-sub">A read-only snapshot of today’s Winter Arc progress. Nothing on this page can edit the private dashboard.</p>
</header>
<section id="content" class="today-card"><div class="empty-share">Loading today’s progress…</div></section>
<footer class="today-footer"><div>Shared selectively · Winter Arc 2026</div><div id="updated"></div></footer>
</main>
<script src="supabase-config.js"></script>
<script>
(async()=>{
const name=document.getElementById("name"),date=document.getElementById("date"),updated=document.getElementById("updated"),content=document.getElementById("content");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=new URLSearchParams(location.search).get("profile");
if(!slug){name.textContent="Winter Arc";content.innerHTML='<div class="empty-share">No public profile was specified.</div>';return;}
try{
if(!window.supabase)await new Promise((resolve,reject)=>{const x=document.createElement("script");x.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2";x.onload=resolve;x.onerror=reject;document.head.appendChild(x);});
const client=window.supabase.createClient(WINTER_ARC_CONFIG.SUPABASE_URL,WINTER_ARC_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const {data,error}=await client.from("winter_arc_public_profiles").select("display_name,snapshot,updated_at").eq("share_slug",slug).maybeSingle();
if(error)throw error;
if(!data){name.textContent="Profile unavailable";content.innerHTML='<div class="empty-share">This public page does not exist or sharing has been turned off.</div>';return;}
name.textContent=data.display_name||"Winter Arc 2026";
updated.textContent="Published "+new Date(data.updated_at).toLocaleString();
const today=data.snapshot?.today;
if(!today){content.innerHTML='<div class="empty-share">Today’s progress has not been published for this profile.</div>';return;}
date.textContent=new Date(today.date+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const total=Number(today.total)||0,completed=Number(today.completed)||0,rate=total?Math.round(completed/total*100):0;
let html='<div class="today-status"><div><div class="today-label">TODAY’S PROGRESS</div><div class="today-count">'+completed+' / '+total+' complete</div></div><div class="today-label">'+rate+'%</div></div><div class="today-track"><i style="width:'+Math.min(100,Math.max(0,rate))+'%"></i></div>';
if(Array.isArray(today.tasks)&&today.tasks.length){html+='<div class="task-list">'+today.tasks.map(t=>'<div class="task '+(t.complete?'done':'')+'"><span class="task-mark">'+(t.complete?'✓':'')+'</span><div><div class="task-title">'+esc(t.title)+'</div>'+(t.detail?'<div class="task-detail">'+esc(t.detail)+'</div>':'')+'</div></div>').join("")+'</div>';}
if(today.complete)html+='<div class="complete-note">Today is complete ✓</div>';
content.innerHTML=html;
}catch(e){name.textContent="Unable to load";content.innerHTML='<div class="empty-share">The public progress could not be loaded right now.</div>';console.error(e);}
})();
</script>
</body>
</html>
